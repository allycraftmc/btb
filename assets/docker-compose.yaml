services:
  lobby-server:
    image: itzg/minecraft-server
    environment:
      - "EULA=true"
      - "TYPE=paper"
      - "VERSION=1.21.11"
      - "MEMORY=2G"
      - "DATAPACKS=/data/datapacks/btb"
      - "MODE=creative"
      - "LEVEL_TYPE=minecraft:flat"
      - "DIFFICULTY=peaceful"
      - "PLUGINS=https://github.com/IntellectualSites/FastAsyncWorldEdit/releases/download/2.15.0/FastAsyncWorldEdit-Paper-2.15.0.jar"
    env_file: .env
    volumes:
      - "${WORLD_PATH:?error}:/data/world"
      - "./datapack:/data/datapacks/btb:ro"
    ports:
      - "25565:25565"